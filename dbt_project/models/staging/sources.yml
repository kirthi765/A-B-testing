version: 2

sources:
  - name: raw
    description: "Tables populated by the simulator via data/warehouse.duckdb."
    schema: main
    tables:
      - name: users
        description: "Synthetic users tagged with a behavioral segment."
        columns:
          - name: user_id
            tests:
              - unique
              - not_null
          - name: segment
            tests:
              - not_null
              - accepted_values:
                  values: ['power_user', 'casual', 'new_signup', 'enterprise']
      - name: events
        description: "Long-format event log. 'session' rows carry latency_ms in `value`; 'conversion' rows have NULL."
        columns:
          - name: event_id
            tests:
              - unique
              - not_null
          - name: event_type
            tests:
              - accepted_values:
                  values: ['session', 'conversion']
      - name: exposures
        description: "Variant assignments from the deterministic hash-mod bucketing service."
        columns:
          - name: user_id
            tests:
              - not_null
          - name: variant
            tests:
              - accepted_values:
                  values: ['control', 'treatment']
